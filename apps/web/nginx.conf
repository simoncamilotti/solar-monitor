server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Keep these headers in the locations that add their own (nginx 1.29.3+).
  add_header_inherit merge;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # The echarts and ag-grid chunks weigh several hundred kB: compressed on the fly.
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # Hashed file names: cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Generated at startup: never cached.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Single-page application: every other path serves index.html, always revalidated.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
